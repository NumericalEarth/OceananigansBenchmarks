<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oceananigans.jl — Performance Dashboard</title>

    <!-- Fonts: Playfair Display for headings, JetBrains Mono for data, Source Sans 3 for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=JetBrains+Mono:wght@400;500&family=Source+Sans+3:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ── Design tokens ─────────────────────────────── */
      :root {
        --abyss: #0a0e17;
        --deep: #0f1523;
        --trench: #141c2e;
        --slate: #1b2540;
        --current: #243156;
        --surface: #2d3d6b;
        --foam: #b0c0e0;
        --light: #dce4f5;
        --white: #f5f7ff;
        --biolum: #00e5c8;
        --biolum-dim: #00b89e;
        --coral: #ff6b6b;
        --gold: #ffd93d;
        --kelp: #6bde8a;
        --jellyfish: #c084fc;
        --font-display: "Playfair Display", Georgia, serif;
        --font-body: "Source Sans 3", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", "Fira Code", monospace;
        --chart-colors: #00e5c8, #ff6b6b, #ffd93d, #6bde8a, #c084fc, #ff9f43,
          #45aaf2, #fd79a8, #a29bfe, #ffeaa7, #dfe6e9, #74b9ff;
      }

      /* ── Reset & base ──────────────────────────────── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        font-size: 17px;
        scroll-behavior: smooth;
        background: var(--abyss);
      }
      body {
        font-family: var(--font-body);
        color: var(--light);
        background: var(--abyss);
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }

      /* ── Noise texture overlay ─────────────────────── */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        background-size: 256px;
        pointer-events: none;
        z-index: 9999;
      }

      /* ── Animations ────────────────────────────────── */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes glow {
        0%,
        100% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
      }
      @keyframes waveShift {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-50%);
        }
      }
      @keyframes statCount {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .fade-up {
        animation: fadeUp 0.6s ease-out both;
      }

      /* ── Hero header ───────────────────────────────── */
      .hero {
        position: relative;
        padding: 3rem 2rem 2.5rem;
        background: linear-gradient(
          170deg,
          var(--abyss) 0%,
          var(--deep) 40%,
          var(--trench) 70%,
          var(--slate) 100%
        );
        overflow: hidden;
        border-bottom: 1px solid var(--current);
      }
      .hero::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--biolum),
          transparent
        );
        opacity: 0.4;
      }

      /* Wave decoration */
      .wave-container {
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 200%;
        height: 40px;
        opacity: 0.08;
        animation: waveShift 18s linear infinite;
      }
      .wave-container svg {
        width: 100%;
        height: 100%;
      }

      .hero-content {
        max-width: 95vw;
        margin: 0 auto;
        position: relative;
        z-index: 1;
      }
      .hero-title {
        font-family: var(--font-display);
        font-weight: 900;
        font-size: clamp(2rem, 5vw, 3.2rem);
        color: var(--white);
        letter-spacing: -0.02em;
        line-height: 1.1;
        margin-bottom: 0.15em;
      }
      .hero-title span {
        color: var(--biolum);
        position: relative;
      }
      .hero-title span::after {
        content: "";
        position: absolute;
        bottom: 2px;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--biolum);
        opacity: 0.3;
        border-radius: 1px;
      }
      .hero-subtitle {
        font-family: var(--font-body);
        font-weight: 300;
        font-size: clamp(0.95rem, 2vw, 1.15rem);
        color: var(--foam);
        max-width: 600px;
        margin-top: 0.5rem;
        line-height: 1.5;
      }

      /* ── Stats bar ─────────────────────────────────── */
      .stats-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem;
        margin-top: 1.8rem;
        padding-top: 1.2rem;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }
      .stat {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        animation: statCount 0.5s ease-out both;
      }
      .stat:nth-child(2) {
        animation-delay: 0.1s;
      }
      .stat:nth-child(3) {
        animation-delay: 0.2s;
      }
      .stat:nth-child(4) {
        animation-delay: 0.3s;
      }
      .stat-value {
        font-family: var(--font-mono);
        font-size: 1.5rem;
        font-weight: 500;
        color: var(--biolum);
        line-height: 1;
      }
      .stat-label {
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--foam);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      /* ── Navigation (TOC) ──────────────────────────── */
      .nav-section {
        max-width: 95vw;
        margin: 0 auto;
        padding: 1.5rem 2rem;
        animation: fadeUp 0.6s ease-out 0.2s both;
      }
      .nav-label {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        font-weight: 500;
        color: var(--foam);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-bottom: 0.75rem;
      }
      .nav-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .nav-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.4rem 0.85rem;
        font-family: var(--font-body);
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--foam);
        background: var(--trench);
        border: 1px solid var(--current);
        border-radius: 100px;
        text-decoration: none;
        transition: all 0.2s ease;
        cursor: pointer;
      }
      .nav-pill:hover {
        color: var(--white);
        background: var(--slate);
        border-color: var(--biolum);
        box-shadow: 0 0 12px rgba(0, 229, 200, 0.15);
      }
      .nav-pill .pill-count {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        color: var(--biolum-dim);
        opacity: 0.7;
      }
      .nav-pill.active {
        color: var(--abyss);
        background: var(--biolum);
        border-color: var(--biolum);
      }
      .nav-pill.active .pill-count {
        color: var(--abyss);
        opacity: 0.6;
      }

      /* ── Main content ──────────────────────────────── */
      .content {
        max-width: 95vw;
        margin: 0 auto;
        padding: 0 2rem 3rem;
      }

      /* ── Benchmark section ─────────────────────────── */
      .bench-section {
        margin-bottom: 2.5rem;
        animation: fadeUp 0.5s ease-out both;
      }
      .bench-section-header {
        display: flex;
        align-items: baseline;
        gap: 1rem;
        margin-bottom: 1rem;
        padding-bottom: 0.6rem;
        border-bottom: 1px solid var(--current);
      }
      .bench-section-title {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.5rem;
        color: var(--white);
      }
      .bench-section-count {
        font-family: var(--font-mono);
        font-size: 0.8rem;
        color: var(--biolum-dim);
      }
      .bench-section-desc {
        font-size: 1rem;
        color: var(--foam);
        margin-bottom: 1.25rem;
        max-width: 900px;
        line-height: 1.5;
      }
      .param-row {
        display: flex;
        align-items: baseline;
        gap: 0.4rem;
        margin-top: 0.6rem;
      }
      .param-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        flex: 1;
      }
      .param-row-label {
        font-family: var(--font-mono);
        font-size: 0.78rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-right: 0.2rem;
        flex-shrink: 0;
      }
      .param-row-label.swept {
        color: var(--biolum);
      }
      .param-row-label.fixed {
        color: var(--foam);
        opacity: 0.6;
      }
      .param-chip {
        display: inline-flex;
        align-items: center;
        font-family: var(--font-mono);
        font-size: 0.8rem;
        padding: 0.15rem 0.5rem;
        border-radius: 4px;
        line-height: 1.4;
      }
      .param-chip .param-key {
        opacity: 0.5;
        margin-right: 0.2rem;
      }
      .param-chip.swept {
        color: var(--biolum);
        background: rgba(0, 229, 200, 0.1);
        border: 1px solid rgba(0, 229, 200, 0.25);
      }
      .param-chip.fixed {
        color: var(--foam);
        background: rgba(143, 164, 208, 0.08);
        border: 1px solid rgba(143, 164, 208, 0.15);
      }

      /* ── Device block ──────────────────────────────── */
      .device-block {
        margin-bottom: 1.5rem;
      }
      .device-tag {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        font-family: var(--font-mono);
        font-size: 0.72rem;
        font-weight: 500;
        color: var(--gold);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 0.25rem 0.6rem;
        background: rgba(255, 217, 61, 0.08);
        border: 1px solid rgba(255, 217, 61, 0.2);
        border-radius: 4px;
        margin-bottom: 0.75rem;
      }
      .device-tag::before {
        content: "◆";
        font-size: 0.5rem;
      }

      /* ── Chart grid ────────────────────────────────── */
      .chart-grid {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      /* ── Chart card ────────────────────────────────── */
      .chart-card {
        background: var(--deep);
        border: 1px solid var(--current);
        border-radius: 10px;
        padding: 1rem;
        transition: all 0.25s ease;
        position: relative;
        overflow: hidden;
      }
      .chart-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(
          90deg,
          var(--biolum),
          var(--jellyfish),
          var(--coral)
        );
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .chart-card:hover {
        border-color: var(--surface);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3),
          0 0 0 1px rgba(0, 229, 200, 0.05);
        transform: translateY(-2px);
      }
      .chart-card:hover::before {
        opacity: 1;
      }
      .chart-card-title {
        font-family: var(--font-body);
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--light);
        text-align: center;
        margin-bottom: 0.5rem;
        padding-bottom: 0.4rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      .chart-canvas-wrap {
        width: 100%;
        height: 320px;
        position: relative;
      }
      .chart-canvas-wrap.nsys {
        height: 480px;
      }

      /* ── Chart + table pair ────────────────────────── */
      .chart-pair {
        display: flex;
        gap: 0.75rem;
        align-items: stretch;
      }
      .chart-pair > .chart-card {
        flex: 0 0 50%;
        min-width: 0;
      }
      .chart-data-table {
        flex: 1;
        min-width: 0;
        overflow-x: auto;
        align-self: center;
      }
      .chart-data-table table {
        border-collapse: collapse;
        font-family: var(--font-mono);
        font-size: 0.8rem;
        white-space: nowrap;
        width: 100%;
      }
      .chart-data-table th {
        color: var(--foam);
        font-weight: 500;
        text-align: left;
        padding: 0.3rem 0.5rem;
        border-bottom: 1px solid var(--current);
      }
      .chart-data-table td {
        color: var(--light);
        text-align: left;
        padding: 0.3rem 0.5rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      }
      .chart-data-table td:first-child {
        color: var(--foam);
      }
      .chart-data-table tr:last-child td {
        border-bottom: none;
      }
      .chart-data-table .delta-pos {
        color: var(--coral);
        font-size: 0.7rem;
      }
      .chart-data-table .delta-neg {
        color: var(--kelp);
        font-size: 0.7rem;
      }
      .chart-data-table .delta-zero {
        color: var(--foam);
        font-size: 0.7rem;
        opacity: 0.5;
      }
      .commit-link {
        color: var(--biolum-dim);
        text-decoration: none;
        cursor: pointer;
        position: relative;
      }
      .commit-link:hover {
        color: var(--biolum);
      }
      .commit-popover {
        display: none;
        position: fixed;
        z-index: 1000;
        background: var(--deep);
        border: 1px solid var(--current);
        border-radius: 8px;
        padding: 0.75rem 1rem;
        min-width: 280px;
        max-width: 400px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 229, 200, 0.1);
      }
      .commit-popover.visible {
        display: block;
      }
      .commit-popover-title {
        font-family: var(--font-body);
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--white);
        margin-bottom: 0.4rem;
        line-height: 1.35;
      }
      .commit-popover-meta {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        color: var(--foam);
        margin-bottom: 0.5rem;
      }
      .commit-popover-link {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        color: var(--biolum);
        text-decoration: none;
      }
      .commit-popover-link:hover {
        text-decoration: underline;
      }
      @media (max-width: 768px) {
        .chart-pair {
          flex-direction: column;
        }
        .chart-data-table {
          max-width: 100%;
        }
      }

      /* ── Footer ────────────────────────────────────── */
      .site-footer {
        max-width: 95vw;
        margin: 0 auto;
        padding: 1.5rem 2rem 2rem;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1rem;
        border-top: 1px solid var(--current);
      }
      .footer-btn {
        font-family: var(--font-mono);
        font-size: 0.78rem;
        font-weight: 500;
        color: var(--biolum);
        background: transparent;
        border: 1px solid var(--biolum-dim);
        padding: 0.45rem 1rem;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .footer-btn:hover {
        background: rgba(0, 229, 200, 0.1);
        box-shadow: 0 0 16px rgba(0, 229, 200, 0.15);
      }
      .footer-spacer {
        flex: 1;
      }
      .footer-credit {
        font-size: 0.75rem;
        color: var(--foam);
        opacity: 0.6;
      }
      .footer-credit a {
        color: var(--biolum-dim);
        text-decoration: none;
      }
      .footer-credit a:hover {
        text-decoration: underline;
      }

      /* ── Responsive ────────────────────────────────── */
      @media (max-width: 768px) {
        .hero {
          padding: 2rem 1.25rem 2rem;
        }
        .nav-section {
          padding: 1.25rem 1.25rem;
        }
        .content {
          padding: 0 1.25rem 2rem;
        }
        .site-footer {
          padding: 1.25rem;
        }
        .stats-bar {
          gap: 1rem;
        }
        .chart-grid {
          grid-template-columns: 1fr;
        }
        .chart-canvas-wrap {
          height: 260px;
        }
      }
      @media (max-width: 480px) {
        .hero {
          padding: 1.5rem 1rem 1.5rem;
        }
        .nav-section {
          padding: 1rem;
        }
        .content {
          padding: 0 1rem 1.5rem;
        }
        .stats-bar {
          gap: 0.75rem;
        }
        .stat-value {
          font-size: 1.2rem;
        }
        .chart-canvas-wrap {
          height: 220px;
        }
      }

      /* ── Scrollbar ─────────────────────────────────── */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--abyss);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--current);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--surface);
      }
    </style>
  </head>

  <body>
    <!-- ── Hero ────────────────────────────────────── -->
    <header class="hero">
      <div class="wave-container">
        <svg viewBox="0 0 2400 40" preserveAspectRatio="none">
          <path
            d="M0,20 Q150,0 300,20 T600,20 T900,20 T1200,20 T1500,20 T1800,20 T2100,20 T2400,20"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            color="#00e5c8"
          />
          <path
            d="M0,25 Q150,8 300,25 T600,25 T900,25 T1200,25 T1500,25 T1800,25 T2100,25 T2400,25"
            fill="none"
            stroke="currentColor"
            stroke-width="1"
            color="#00e5c8"
            opacity="0.5"
          />
        </svg>
      </div>
      <div class="hero-content fade-up">
        <h1 class="hero-title">
          Oceananigans<span>.jl</span>
        </h1>
        <p class="hero-subtitle">
          Performance dashboard tracking GPU benchmark regressions across
          commits. Measures time-per-timestep and CUDA kernel profiling for
          ocean simulations running on an NVIDIA TITAN V.
        </p>
        <div class="stats-bar" id="stats-bar">
          <!-- filled by JS -->
        </div>
      </div>
    </header>

    <!-- ── Navigation ──────────────────────────────── -->
    <nav class="nav-section">
      <div class="nav-label">Benchmark Groups</div>
      <div class="nav-pills" id="nav-pills">
        <!-- filled by JS -->
      </div>
    </nav>

    <!-- ── Charts ──────────────────────────────────── -->
    <main class="content" id="main"></main>

    <!-- ── Footer ──────────────────────────────────── -->
    <footer class="site-footer">
      <button class="footer-btn" id="dl-button">Download JSON</button>
      <div class="footer-spacer"></div>
      <div class="footer-credit">
        Powered by
        <a
          href="https://github.com/marketplace/actions/continuous-benchmark"
          rel="noopener"
          target="_blank"
          >github-action-benchmark</a
        >
        ·
        <a
          href="https://github.com/CliMA/Oceananigans.jl"
          rel="noopener"
          target="_blank"
          >CliMA/Oceananigans.jl</a
        >
      </div>
    </footer>

    <!-- ── Scripts ─────────────────────────────────── -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="data.js"></script>
    <script>
      "use strict";
      (function () {
        /* ── Palette ──────────────────────────────── */
        const COLORS = [
          "#00e5c8", // teal
          "#ff5555", // red
          "#f1c232", // gold
          "#36d989", // green
          "#b06cff", // purple
          "#ff9f1a", // orange
          "#2196f3", // blue
          "#ff4da6", // pink
          "#e0e0e0", // silver
          "#00bcd4", // cyan
          "#ff6e40", // deep orange
          "#8bc34a", // lime
        ];

        const MAX_COMMITS = 20;

        /* ── Section descriptions ─────────────────── */
        const DESCRIPTIONS = {
          Default:
            "Baseline configuration — tracks the default simulation setup across commits to detect regressions.",
          "Resolution Sweep": {
            text: "Varying grid resolution from 180×90×50 to 720×360×50. Shows how performance scales with problem size.",
            swept: "size",
            fixed: { grid_type: "tripolar", float_type: "Float64", momentum_advection: "WENOVectorInvariantDefault", tracer_advection: "WENO7", closure: "CATKE" },
          },
          "Float Type Sweep": {
            text: "Comparing Float32 vs Float64 arithmetic. Float32 can double throughput on consumer GPUs.",
            swept: "float_type",
            fixed: { grid_type: "tripolar", size: "360×180×50", momentum_advection: "WENOVectorInvariantDefault", tracer_advection: "WENO7", closure: "CATKE" },
          },
          "Closure Sweep": {
            text: "Testing different turbulence closure models — complicated closures are expensive, simpler closures are faster.",
            swept: "closure",
            fixed: { grid_type: "tripolar", size: "360×180×50", float_type: "Float64", momentum_advection: "WENOVectorInvariantDefault", tracer_advection: "WENO7" },
          },
          "Advection Sweep": {
            text: "Comparing advection schemes from nothing to WENO 9th order. Higher-order schemes cost more per timestep.",
            swept: "momentum_advection, tracer_advection",
            fixed: { grid_type: "tripolar", size: "360×180×50", float_type: "Float64", closure: "CATKE" },
          },
          "Grid Type Sweep": {
            text: "Tripolar vs latitude-longitude grids, with and without z-star coordinates and immersed boundaries. Dashed lines indicate z-star variants.",
            swept: "grid_type, zstar_coordinate",
            fixed: { size: "360×180×50", float_type: "Float64", momentum_advection: "WENOVectorInvariantDefault", tracer_advection: "WENO7", closure: "CATKE" },
          },
          "Tracer Count Sweep": {
            text: "Scaling the number of passive tracers from 2 to 5. Each additional tracer adds advection and diffusion work.",
            swept: "tracers",
            fixed: { grid_type: "tripolar", size: "360×180×50", float_type: "Float64", closure: "CATKE" },
          },
          "NSYS Kernels": {
            text: "CUDA kernel-level profiling via NVIDIA Nsight Systems. Tracks median GPU time for the hottest kernels.",
          },
          Default: {
            text: "Baseline configuration — tracks the default simulation setup across commits to detect regressions.",
          },
          "NSYS Kernels":
            "CUDA kernel-level profiling via NVIDIA Nsight Systems. Tracks median GPU time for the hottest kernels.",
        };

        /* ── Data ingestion ───────────────────────── */
        function init() {
          const data = window.BENCHMARK_DATA;

          /* ── Stats ───────────────────────────────── */
          const entries = data.entries[Object.keys(data.entries)[0]];
          const totalCommits = entries.length;
          const totalBenches = entries.reduce(
            (s, e) => s + e.benches.length,
            0
          );
          const lastDate = new Date(data.lastUpdate);
          const ago = timeAgo(lastDate);

          const statsBar = document.getElementById("stats-bar");
          statsBar.innerHTML = `
            <div class="stat">
              <span class="stat-value">${totalCommits}</span>
              <span class="stat-label">Commits tracked</span>
            </div>
            <div class="stat">
              <span class="stat-value">${totalBenches.toLocaleString()}</span>
              <span class="stat-label">Data points</span>
            </div>
            <div class="stat">
              <span class="stat-value">${ago}</span>
              <span class="stat-label">Last update</span>
            </div>
            <div class="stat">
              <span class="stat-value"><a href="${data.repoUrl}" target="_blank" rel="noopener" style="color:var(--biolum);text-decoration:none;font-family:var(--font-mono)">CliMA</a></span>
              <span class="stat-label">Repository</span>
            </div>
          `;

          /* ── Download ────────────────────────────── */
          document.getElementById("dl-button").onclick = () => {
            const blob = new Blob([JSON.stringify(data, null, 2)], {
              type: "application/json",
            });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "benchmark_data.json";
            a.click();
            URL.revokeObjectURL(a.href);
          };

          /* ── Collect hierarchy ───────────────────── */
          return collectHierarchy(entries);
        }

        function timeAgo(date) {
          const seconds = Math.floor((Date.now() - date) / 1000);
          if (seconds < 60) return "just now";
          const mins = Math.floor(seconds / 60);
          if (mins < 60) return `${mins}m ago`;
          const hrs = Math.floor(mins / 60);
          if (hrs < 24) return `${hrs}h ago`;
          const days = Math.floor(hrs / 24);
          return `${days}d ago`;
        }

        function collectHierarchy(entries) {
          const map = new Map();
          for (const entry of entries) {
            const { commit, date, tool, benches } = entry;
            for (const bench of benches) {
              const result = { commit, date, tool, bench };
              const parts = bench.name.split("/");
              const group = parts[0];
              const fixed = parts[1];
              const device = parts[2];
              const variant = parts[3];

              if (!map.has(group)) map.set(group, new Map());
              const gMap = map.get(group);
              if (!gMap.has(device)) gMap.set(device, new Map());
              const dMap = gMap.get(device);
              if (!dMap.has(fixed)) dMap.set(fixed, new Map());
              const fMap = dMap.get(fixed);
              if (!fMap.has(variant)) fMap.set(variant, []);
              fMap.get(variant).push(result);
            }
          }
          return map;
        }

        /* ── Rendering ────────────────────────────── */
        function render(dataSet) {
          const main = document.getElementById("main");
          const navPills = document.getElementById("nav-pills");
          const groups = [...dataSet.keys()].sort((a, b) => {
            // Default first, NSYS last, rest alphabetical
            if (a === "Default") return -1;
            if (b === "Default") return 1;
            if (a.startsWith("NSYS")) return 1;
            if (b.startsWith("NSYS")) return -1;
            return a.localeCompare(b);
          });

          /* ── Nav pills ──────────────────────────── */
          for (const group of groups) {
            const deviceMap = dataSet.get(group);
            let chartCount = 0;
            for (const dMap of deviceMap.values()) {
              chartCount += dMap.size;
            }

            const pill = document.createElement("a");
            pill.className = "nav-pill";
            pill.href = `#section-${slug(group)}`;
            pill.innerHTML = `${group} <span class="pill-count">${chartCount}</span>`;
            navPills.appendChild(pill);
          }

          /* ── Sections ───────────────────────────── */
          let sectionDelay = 0.3;
          for (const group of groups) {
            const deviceMap = dataSet.get(group);
            let chartCount = 0;
            for (const dMap of deviceMap.values()) {
              chartCount += dMap.size;
            }

            const section = document.createElement("section");
            section.className = "bench-section";
            section.id = `section-${slug(group)}`;
            section.style.animationDelay = `${sectionDelay}s`;
            sectionDelay += 0.08;

            const descKey = Object.keys(DESCRIPTIONS).find((k) =>
              group.startsWith(k)
            );
            const desc = descKey ? DESCRIPTIONS[descKey] : null;

            let descHTML = "";
            if (desc) {
              const text = typeof desc === "string" ? desc : desc.text;
              descHTML = `<div class="bench-section-desc">${text}`;

              if (desc.swept) {
                descHTML += `<div class="param-row"><span class="param-row-label swept">Swept:</span><div class="param-chips">`;
                for (const s of desc.swept.split(", ")) {
                  descHTML += `<span class="param-chip swept">${s}</span>`;
                }
                descHTML += `</div></div>`;
              }
              if (desc.fixed) {
                descHTML += `<div class="param-row"><span class="param-row-label fixed">Fixed:</span><div class="param-chips">`;
                for (const [k, v] of Object.entries(desc.fixed)) {
                  descHTML += `<span class="param-chip fixed"><span class="param-key">${k}=</span>${v}</span>`;
                }
                descHTML += `</div></div>`;
              }
              descHTML += `</div>`;
            }

            section.innerHTML = `
              <div class="bench-section-header">
                <h2 class="bench-section-title">${group}</h2>
                <span class="bench-section-count">${chartCount} chart${chartCount !== 1 ? "s" : ""}</span>
              </div>
              ${descHTML}
            `;

            const unitInfo = group.startsWith("NSYS")
              ? { yLabel: "ms (median GPU time)", unit: "ms" }
              : { yLabel: "s / timestep", unit: "s/timestep" };

            // Flatten all devices into a single grid (single GPU)
            const grid = document.createElement("div");
            grid.className = "chart-grid";

            const devices = [...deviceMap.keys()].sort();
            for (const device of devices) {
              const fixedMap = deviceMap.get(device);
              const fixedKeys = [...fixedMap.keys()].sort();
              for (const fixed of fixedKeys) {
                const pair = document.createElement("div");
                pair.className = "chart-pair";

                const card = document.createElement("div");
                card.className = "chart-card";
                card.innerHTML = `<div class="chart-card-title">${fixed}</div>`;

                const isNSYS = group.startsWith("NSYS");
                const wrap = document.createElement("div");
                wrap.className = "chart-canvas-wrap" + (isNSYS ? " nsys" : "");
                card.appendChild(wrap);

                pair.appendChild(card);

                const tableDiv = buildDataTable(fixedMap.get(fixed), unitInfo);
                pair.appendChild(tableDiv);

                grid.appendChild(pair);

                renderChart(wrap, fixedMap.get(fixed), unitInfo);
              }
            }
            section.appendChild(grid);

            main.appendChild(section);
          }

          /* ── Intersection observer for nav highlight ─ */
          const observer = new IntersectionObserver(
            (entries) => {
              for (const entry of entries) {
                const id = entry.target.id;
                const pill = navPills.querySelector(`a[href="#${id}"]`);
                if (pill) {
                  pill.classList.toggle("active", entry.isIntersecting);
                }
              }
            },
            { threshold: 0.15 }
          );
          document.querySelectorAll(".bench-section").forEach((s) => observer.observe(s));
        }

        /* ── Chart rendering ──────────────────────── */
        /* ── Data table beside chart ───────────── */
        function buildDataTable(variantMap, unitInfo) {
          const TAIL = 5;

          // Collect and sort all commits across variants
          const allCommits = new Map();
          for (const results of variantMap.values()) {
            for (const r of results) {
              allCommits.set(r.commit.id, {
                id: r.commit.id,
                date: r.date,
                commit: r.commit,
              });
            }
          }
          const sorted = [...allCommits.values()]
            .sort((a, b) => a.date - b.date)
            .slice(-TAIL);

          const variantNames = [...variantMap.keys()].sort();

          // Build lookup: variant -> commit id -> value
          const lookup = new Map();
          for (const name of variantNames) {
            const byCommit = new Map();
            for (const r of variantMap.get(name)) {
              byCommit.set(r.commit.id, r.bench.value);
            }
            lookup.set(name, byCommit);
          }

          function fmt(v) {
            if (v == null) return "—";
            if (v < 0.001) return v.toExponential(2);
            if (v < 1) return v.toFixed(4);
            return v.toFixed(3);
          }

          // Header row
          let html = "<table><thead><tr><th>commit</th>";
          for (const name of variantNames) {
            html += `<th>${cleanKernel(name)}</th>`;
          }
          html += "</tr></thead><tbody>";

          // Data rows (most recent at top)
          for (let i = sorted.length - 1; i >= 0; i--) {
            const c = sorted[i];
            const sha = c.id.slice(0, 7);
            const msg = (c.commit.message || "").split("\n")[0];
            const author = c.commit.author ? c.commit.author.username || c.commit.author.name : "";
            const url = c.commit.url || "";
            html += `<tr><td><a class="commit-link" data-msg="${msg.replace(/"/g, '&quot;')}" data-author="${author}" data-url="${url}">${sha}</a></td>`;
            for (const name of variantNames) {
              const val = lookup.get(name).get(c.id);
              const prev =
                i > 0 ? lookup.get(name).get(sorted[i - 1].id) : null;

              let delta = "";
              if (val != null && prev != null && prev !== 0) {
                const pct = ((val - prev) / prev) * 100;
                if (Math.abs(pct) < 0.05) {
                  delta = ` <span class="delta-zero">±0%</span>`;
                } else if (pct > 0) {
                  delta = ` <span class="delta-pos">+${pct.toFixed(1)}%</span>`;
                } else {
                  delta = ` <span class="delta-neg">${pct.toFixed(1)}%</span>`;
                }
              }
              html += `<td>${fmt(val)}${delta}</td>`;
            }
            html += "</tr>";
          }

          html += "</tbody></table>";

          const div = document.createElement("div");
          div.className = "chart-data-table";
          div.innerHTML = html;
          return div;
        }

        function renderChart(container, variantMap, unitInfo) {
          const canvas = document.createElement("canvas");
          canvas.style.width = "100%";
          canvas.style.height = "100%";
          container.appendChild(canvas);

          // Collect all commits across variants
          const allCommits = new Map();
          for (const results of variantMap.values()) {
            for (const r of results) {
              allCommits.set(r.commit.id, {
                id: r.commit.id,
                date: r.date,
                commit: r.commit,
              });
            }
          }
          const sorted = [...allCommits.values()]
            .sort((a, b) => a.date - b.date)
            .slice(-MAX_COMMITS);

          const variantNames = [...variantMap.keys()].sort();
          const datasets = [];
          const variantIndices = new Map();

          // Build color map: zstar variants share color with their base
          const colorMap = new Map();
          let colorIdx = 0;
          for (const name of variantNames) {
            const base = name.replace(/_?zstar$/, "");
            if (!colorMap.has(base)) {
              colorMap.set(base, COLORS[colorIdx % COLORS.length]);
              colorIdx++;
            }
          }

          variantNames.forEach((name, i) => {
            const results = variantMap.get(name);
            const commitMap = new Map(results.map((r) => [r.commit.id, r]));
            const isZstar = /(_?zstar)$/.test(name);
            const base = name.replace(/_?zstar$/, "");
            const color = colorMap.get(base) || COLORS[i % COLORS.length];

            datasets.push({
              label: cleanKernel(name.trim()),
              data: sorted.map((c) => {
                const r = commitMap.get(c.id);
                return r ? r.bench.value : null;
              }),
              borderColor: color,
              backgroundColor: color + "18",
              pointBackgroundColor: color,
              pointBorderColor: color,
              pointRadius: 3,
              pointHoverRadius: 6,
              borderWidth: 2,
              borderDash: isZstar ? [6, 3] : [],
              tension: 0,
              spanGaps: true,
              fill: datasets.length === 0,
            });
            variantIndices.set(i, name);
          });

          new Chart(canvas, {
            type: "line",
            data: {
              labels: sorted.map((c) => c.id.slice(0, 7)),
              datasets,
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              interaction: {
                mode: "index",
                intersect: false,
              },
              plugins: {
                legend: {
                  display: true,
                  position: "bottom",
                  labels: {
                    color: "#b0c0e0",
                    font: {
                      family: "'Source Sans 3', sans-serif",
                      size: 12,
                    },
                    boxWidth: 10,
                    boxHeight: 2,
                    padding: 6,
                    usePointStyle: false,
                  },
                },
                tooltip: {
                  backgroundColor: "rgba(10, 14, 23, 0.95)",
                  titleColor: "#f5f7ff",
                  bodyColor: "#dce4f5",
                  borderColor: "rgba(0, 229, 200, 0.2)",
                  borderWidth: 1,
                  titleFont: {
                    family: "'JetBrains Mono', monospace",
                    size: 13,
                  },
                  bodyFont: {
                    family: "'Source Sans 3', sans-serif",
                    size: 14,
                  },
                  padding: 10,
                  cornerRadius: 6,
                  callbacks: {
                    afterTitle: function (items) {
                      if (!items.length) return "";
                      const idx = items[0].dataIndex;
                      const commit = sorted[idx].commit;
                      return (
                        commit.message.split("\n")[0].slice(0, 72) +
                        "\n" +
                        commit.timestamp +
                        " by @" +
                        commit.author.username
                      );
                    },
                    label: function (ctx) {
                      const v = ctx.parsed.y;
                      if (v === null) return null;
                      const formatted =
                        v < 0.001
                          ? v.toExponential(2)
                          : v < 1
                            ? v.toFixed(4)
                            : v.toFixed(3);
                      return ` ${ctx.dataset.label}: ${formatted} ${unitInfo.unit}`;
                    },
                  },
                },
              },
              scales: {
                x: {
                  ticks: {
                    color: "#b0c0e0",
                    font: {
                      family: "'JetBrains Mono', monospace",
                      size: 12,
                    },
                    maxRotation: 45,
                  },
                  grid: {
                    color: "rgba(255,255,255,0.04)",
                  },
                  title: {
                    display: true,
                    text: "commit",
                    color: "#b0c0e088",
                    font: {
                      family: "'Source Sans 3', sans-serif",
                      size: 12,
                    },
                  },
                },
                y: {
                  ticks: {
                    color: "#b0c0e0",
                    font: {
                      family: "'JetBrains Mono', monospace",
                      size: 12,
                    },
                    maxTicksLimit: 6,
                    callback: function (v) {
                      if (v === 0) return "0";
                      if (v < 0.001) return v.toExponential(2);
                      if (v < 1) return v.toFixed(4);
                      return v.toFixed(2);
                    },
                  },
                  grid: {
                    color: "rgba(255,255,255,0.04)",
                  },
                  title: {
                    display: true,
                    text: unitInfo.yLabel,
                    color: "#b0c0e088",
                    font: {
                      family: "'Source Sans 3', sans-serif",
                      size: 12,
                    },
                  },
                },
              },
              onClick: function (_event, elements) {
                if (!elements.length) return;
                const idx = elements[0].index;
                const commit = sorted[idx].commit;
                if (commit.url) window.open(commit.url, "_blank");
              },
            },
          });
        }

        function cleanKernel(s) {
          return s.replace(/^gpu__?/, "");
        }

        function truncate(s, max) {
          return s.length > max ? s.slice(0, max - 1) + "…" : s;
        }

        function slug(s) {
          return s
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/(^-|-$)/g, "");
        }

        /* ── Go ───────────────────────────────────── */
        render(init());

        /* ── Commit popover ───────────────────────── */
        const popover = document.createElement("div");
        popover.className = "commit-popover";
        document.body.appendChild(popover);

        document.addEventListener("click", (e) => {
          const link = e.target.closest(".commit-link");
          if (!link) {
            popover.classList.remove("visible");
            return;
          }
          e.preventDefault();
          const msg = link.dataset.msg;
          const author = link.dataset.author;
          const url = link.dataset.url;

          popover.innerHTML = `
            <div class="commit-popover-title">${msg}</div>
            <div class="commit-popover-meta">by @${author}</div>
            ${url ? `<a class="commit-popover-link" href="${url}" target="_blank" rel="noopener">View commit →</a>` : ""}
          `;

          const rect = link.getBoundingClientRect();
          let top = rect.bottom + 6;
          let left = rect.left;

          popover.classList.add("visible");

          // Keep within viewport
          const pRect = popover.getBoundingClientRect();
          if (left + pRect.width > window.innerWidth - 16) {
            left = window.innerWidth - pRect.width - 16;
          }
          if (top + pRect.height > window.innerHeight - 16) {
            top = rect.top - pRect.height - 6;
          }

          popover.style.top = `${top}px`;
          popover.style.left = `${left}px`;
        });
      })();
    </script>
  </body>
</html>
